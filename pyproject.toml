[project]
name = "ritmo"
version = "0.1.0"
description = "Pipeline de dados que decompõe o clima das estações do INMET em séries de Fourier"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "polars>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
